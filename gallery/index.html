<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Mubiru Elton Felix</title>
    <meta name="description" content="Image gallery from existing portfolio assets and Elton photos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body data-root="../">
    <div id="site-nav"></div>

    <main class="section">
        <div class="container">
            <h1 class="section-title reveal">Gallery</h1>
            <p class="section-lead reveal">A responsive gallery reusing existing profile photos and Elton images.</p>

            <section class="grid gallery-grid">
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/profile.jpg" alt="Profile image"></figure>
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/mubiruelton1.jpg" alt="Mubiru Elton Felix portrait"></figure>
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/mubirueltonfelix.jpg" alt="Mubiru Elton Felix image"></figure>
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/mubirueltonfelix2.jpg" alt="Mubiru Elton Felix photo"></figure>
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/elton_1.jpg" alt="Elton image 1"></figure>
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/elton_2.jpg" alt="Elton image 2"></figure>
                <figure class="gallery-item reveal"><img loading="lazy" src="../assets/images/elton_3.jpg" alt="Elton image 3"></figure>
            </section>
        </div>
    </main>

    <div id="galleryModal" class="modal" aria-hidden="true">
        <button class="modal-close" aria-label="Close image">Close</button>
        <img id="galleryModalImage" src="" alt="Expanded gallery image">
    </div>

    <div id="site-footer"></div>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
