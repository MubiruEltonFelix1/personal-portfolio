<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <title>Gallery | Mubiru Elton Felix</title>
    <meta name="description" content="Image gallery from existing portfolio assets and Elton photos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body data-root="../">
    <div id="site-nav"></div>

    <main class="section">
        <div class="container">
            <h1 class="section-title reveal">Gallery</h1>
            <p class="section-lead reveal">A responsive gallery highlighting key moments in my professional and community journey.</p>

            <section class="grid gallery-grid">
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/mubiruelton1.jpg" alt="Mubiru Elton Felix at a Google Developer Groups event in Mbarara">
                    </div>
                    <figcaption>Attended my first Google Developer Groups event in Mbarara, expanding my developer network and community engagement.</figcaption>
                </figure>
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/mubirueltonfelix.jpg" alt="Mubiru Elton Felix working on a mechanics workshop project at Bosch">
                    </div>
                    <figcaption>Led project work for a mechanics workshop at Bosch, focusing on practical solutions and technical execution.</figcaption>
                </figure>
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/mubirueltonfelix2.jpg" alt="Mubiru Elton Felix at Cafe Javas in Kampala">
                    </div>
                    <figcaption>A reflective moment at Cafe Javas in Kampala after an intensive cycle of project development.</figcaption>
                </figure>
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/elton_1.jpg" alt="Mubiru Elton Felix serving as a judge at the BlueOx Vibe Coding Competition">
                    </div>
                    <figcaption>Selected as a judge for the BlueOx Vibe Coding Competition, evaluating innovation and technical quality.</figcaption>
                </figure>
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/elton_2.jpg" alt="Mubiru Elton Felix serving as Year 1 pod lead at BlueOx">
                    </div>
                    <figcaption>Served as the Year 1 pod lead at BlueOx, mentoring peers and coordinating team progress.</figcaption>
                </figure>
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/elton_3.jpg" alt="Mubiru Elton Felix conducting database fieldwork at Mbarara Mixed Primary School">
                    </div>
                    <figcaption>Conducted database fieldwork at Mbarara Mixed Primary School to support data collection and system planning.</figcaption>
                </figure>
                <figure class="gallery-item reveal">
                    <div class="gallery-item-media">
                        <img loading="lazy" src="../assets/images/mucosa_dinner_promo.PNG" alt="Behind the scenes of the MUCOSA Dinner 2026 promo shoot">
                    </div>
                    <figcaption>Sometimes the work goes beyond the keyboard. This was behind the scenes of the MUCOSA Dinner 2026 promo shoot.</figcaption>
                </figure>
            </section>
        </div>
    </main>

    <div id="galleryModal" class="modal" aria-hidden="true">
        <button class="modal-close" aria-label="Close image">Close</button>
        <img id="galleryModalImage" src="" alt="Expanded gallery image">
    </div>

    <div id="site-footer"></div>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
